name: Chromatic

on: push

jobs:
  prepare:
    name: Resolve Playwright version
    runs-on: ubuntu-latest
    outputs:
      playwright_version: ${{ steps.playwright_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read Playwright version
        id: playwright_version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  playwright:
    name: Build and capture visual snapshots
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ${{ format('mcr.microsoft.com/playwright:v{0}-noble', needs.prepare.outputs.playwright_version) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.4

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          ELEVENTY_ENV: production
          TZ: Australia/Melbourne

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          HOME: /root

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./test-results
          retention-days: 30

  chromatic:
    name: Run Chromatic
    needs: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.4

      - name: Install dependencies
        run: npm ci

      - name: Download Playwright test results
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: ./test-results

      - name: Run Chromatic
        run: |
          npx chromatic \
            --project-token=${{ secrets.CHROMATIC_PROJECT_TOKEN }} \
            --playwright \
            --auto-accept-changes=main \
            --exit-once-uploaded \
            --diagnostics-file=chromatic-diagnostics.json \
            --log-file=chromatic.log

      - name: Upload Chromatic diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: chromatic-diagnostics
          path: |
            ./chromatic.log
            ./chromatic-diagnostics.json
          if-no-files-found: warn
          retention-days: 30
